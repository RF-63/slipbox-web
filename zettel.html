<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self' https://accounts.google.com;
               connect-src 'self' https://www.googleapis.com https://accounts.google.com;
               style-src 'self' 'unsafe-inline' https://accounts.google.com;
               img-src 'self' data: blob:;
               font-src 'self' data:;
               frame-src https://accounts.google.com;
               base-uri 'none';
               object-src 'none'"
    />
    <!-- Vom Home-Bildschirm aus ohne Browserleiste, wie eine App. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Zettel" />
    <meta name="theme-color" content="#f2c640" />
    <!-- iOS nimmt dieses Bild fuer den Home-Bildschirm, Chrome und Edge das
         Manifest fuer "Als App installieren". -->
    <link rel="apple-touch-icon" href="./icons/zettel-180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/zettel-192.png" />
    <link rel="manifest" href="./zettel.webmanifest" />
    <title>Zettel</title>
    <script type="module" crossorigin src="./assets/zettel-BLwoY0XK.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/api-D6gkXMCG.js">
    <link rel="stylesheet" crossorigin href="./assets/zettel-BLCtVHkw.css">
  </head>
  <body>
    <main class="zettel">
      <textarea
        id="feld"
        class="zettel__feld"
        placeholder="Sprich oder tipp deinen Gedanken …"
        autocapitalize="sentences"
        autocomplete="off"
        spellcheck="true"
      ></textarea>
      <div id="bilder" class="zettel__bilder" hidden></div>
      <p id="stand" class="zettel__stand" role="status" aria-live="polite"></p>
      <div class="zettel__reihe">
        <button id="bild" class="zettel__nebenknopf" type="button">Bild</button>
        <button id="ab" class="zettel__knopf" type="button">In den Kasten</button>
      </div>
      <!-- Ohne `capture`: iOS bietet dann Fotomediathek, Kamera und Dateien
           zur Wahl. Mit `capture` gaebe es nur die Kamera — und ein
           Bildschirmfoto waere nicht mehr erreichbar. -->
      <input id="datei" class="zettel__datei" type="file" accept="image/*" multiple />
      <a id="voll" class="zettel__voll" href="./index.html">Zum vollen Kasten</a>
    </main>
  </body>
</html>
